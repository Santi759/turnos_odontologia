services:
  db:
    image: postgres:18.6-trixie
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Base efimera y separada para pruebas de integracion y migraciones de prueba (DF-04).
  # Sin volumen con nombre, sin puertos publicados; solo se levanta con el perfil "test".
  db-test:
    image: postgres:18.6-trixie
    profiles: ["test"]
    environment:
      - POSTGRES_USER=app
      # RT3-06: contrasena EFIMERA del superusuario, generada por scripts/test.ps1 en cada ejecucion;
      # sin ella PostgreSQL no inicializa y db-test no arranca. Nunca un literal en el repositorio.
      - POSTGRES_PASSWORD=${TURNOS_DB_TEST_PASSWORD:-}
      - POSTGRES_DB=turnos_test
      # Contrasenas efimeras de los roles turnos_app y turnos_login (DD-14, DD-21): se declaran
      # por NOMBRE, sin valor; las genera scripts/test.ps1 y solo viven en el entorno del proceso.
      - TURNOS_APP_TEST_PASSWORD
      - TURNOS_LOGIN_TEST_PASSWORD
    tmpfs:
      - /var/lib/postgresql
    volumes:
      # Unico montaje de db-test: el script que crea los cuatro roles, de solo lectura.
      - type: bind
        source: ./db/test-init/10_roles_prueba.sh
        target: /docker-entrypoint-initdb.d/10_roles_prueba.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Imagen comun del backend, compartida con el servicio admin (se construye una sola vez).
    image: turnos_odontologia-api
    # DD-34 (RT3-01): SIN env_file. El proceso permanente de la API recibe solo estas variables,
    # interpoladas desde .env; nunca DATABASE_MIGRATION_URL, POSTGRES_*, PGPASSWORD ni TEST_DATABASE_URL
    # (RT3-06: la URL de pruebas la arma el runner y la pasa solo a contenedores efimeros).
    # Una variable del shell con otro nombre no llega al contenedor.
    environment:
      DATABASE_URL: ${DATABASE_URL:?definir DATABASE_URL en .env}
      DATABASE_LOGIN_URL: ${DATABASE_LOGIN_URL:?definir DATABASE_LOGIN_URL en .env}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?definir AUTH_SECRET_KEY en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?definir CORS_ALLOWED_ORIGINS en .env}
      APP_ENV: ${APP_ENV:?definir APP_ENV en .env}
      # Opcionales: vacias toman el valor por defecto de Settings (env_ignore_empty).
      AUTH_SESSION_MINUTES: ${AUTH_SESSION_MINUTES:-}
      AUTH_SESSION_MAX_HOURS: ${AUTH_SESSION_MAX_HOURS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # DD-34 (RT3-05): codigo de SOLO LECTURA; un compromiso de la API no puede modificar el codigo
      # que despues ejecuta admin. La recarga solo lee; los temporales van a /tmp.
      - ./backend:/app:ro
      # Solo la plantilla de variables, de solo lectura y fuera de /app, para las pruebas
      # unitarias de la plantilla. Nunca se monta .env ni otro archivo con secretos.
      - ./.env.example:/repo/.env.example:ro
    depends_on:
      db:
        condition: service_healthy
    # --no-proxy-headers: la IP del limite de intentos es la de la conexion directa (DD-19);
    # uvicorn no debe reescribirla desde X-Forwarded-For.
    command: uvicorn --factory app.main:crear_app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers

  # DD-34 (RT3-01): administracion efimera (Alembic de desarrollo, seed, credenciales, roles y
  # mantenimiento). Unico servicio con la credencial de administracion. Uso exclusivo:
  #   docker compose run --rm --no-deps admin <comando>      (-it si el comando pide datos)
  # Sin puertos y sin reinicio; ningun servicio depende de el. Si se lo selecciona con `up`, su
  # comando por defecto termina con error: nunca queda en ejecucion. La app web se niega a crearse
  # con este entorno (guardia de crear_app).
  admin:
    build: ./backend
    image: turnos_odontologia-api
    profiles: ["admin"]
    env_file: .env
    volumes:
      # DD-34 (RT3-05): solo lectura; las migraciones nuevas se escriben en el host.
      - ./backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command:
      - python
      - -c
      - "import sys; sys.exit('admin: servicio solo para comandos administrativos; usar: docker compose run --rm --no-deps admin <comando>')"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?definir VITE_API_BASE_URL en .env}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  pgdata:
  frontend_node_modules:
